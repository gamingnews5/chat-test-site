<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Chat Test Site</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true">C</span>
        <div>
          <h1>Chat Test Site</h1>
          <p>OpenCode Go</p>
        </div>
      </div>
      <button id="newChat" class="primary wide" type="button">New chat</button>
      <div class="history-head">
        <span>History</span>
        <button id="clearHistory" class="link" type="button">Clear</button>
      </div>
      <nav class="history-wrap" aria-label="Chat history">
        <ul id="historyList" class="history-list"></ul>
      </nav>
      <div class="sidebar-foot">
        <a href="/__gate/logout">Sign out</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <label class="control model-control" for="model">
          <span>Model</span>
          <select id="model"></select>
        </label>
        <label class="control narrow" for="temperature">
          <span>Temperature</span>
          <input id="temperature" type="number" min="0" max="2" step="0.1" inputmode="decimal">
        </label>
        <label class="control narrow" for="maxTokens">
          <span>Max tokens</span>
          <input id="maxTokens" type="number" min="1" max="200000" step="1" inputmode="numeric">
        </label>
        <span id="modelStatus" class="model-status" role="status" aria-live="polite"></span>
      </header>

      <section class="system-panel">
        <label for="systemPrompt">System prompt</label>
        <textarea id="systemPrompt" rows="3" placeholder="You are a helpful assistant."></textarea>
      </section>

      <section id="messages" class="messages" aria-label="Conversation">
        <div id="emptyState" class="empty-state">
          <h2>Test a prompt</h2>
          <p>Pick a model, write a system prompt, and send a message. Everything stays in this browser's localStorage.</p>
        </div>
      </section>

      <form id="composer" class="composer">
        <textarea id="message" rows="3" placeholder="Type a message... (Enter to send, Shift+Enter for a new line)"></textarea>
        <div class="composer-row">
          <span id="charCount" class="char-count"></span>
          <button id="stop" class="danger" type="button" hidden>Stop</button>
          <button id="send" class="primary" type="submit">Send</button>
        </div>
      </form>
    </main>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
