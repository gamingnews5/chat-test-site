services:
  chat-test-site:
    build: .
    image: chat-test-site:1
    container_name: chat-test-site
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8810"
    ports:
      - "127.0.0.1:8810:8810"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
